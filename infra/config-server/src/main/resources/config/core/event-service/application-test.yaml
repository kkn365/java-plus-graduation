server:
  port: 0
  servlet:
    encoding:
      force: true
      charset: UTF-8

spring:
  config:
    activate:
      on-profile: test  # Активирует эту конфигурацию только при запущенном профиле 'test'

  jpa:
    hibernate:
      ddl-auto: update  # Автоматическое обновление схемы БД
    properties:
      hibernate:
        format_sql: true  # Форматирование SQL-запросов в логах для удобства отладки

  datasource:
    driver-class-name: org.h2.Driver  # Используется вместо deprecated driverClassName
    url: jdbc:h2:mem:events_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH  # H2 в памяти с PostgreSQL-совместимым режимом
    username: ewm-event-test
    password: ewm-event-test

logging:
  level:
    org:
      springframework:
        orm:
          jpa: DEBUG  # Логирование операций JPA
          jpa.JpaTransactionManager: DEBUG  # Логирование транзакций JPA
        transaction:
          TransactionInterceptor: DEBUG  # Логирование Spring Transaction Interceptor
      hibernate:
        SQL: DEBUG  # Логирование SQL-запросов Hibernate
        type.descriptor.sql.BasicBinder: DEBUG  # Логирование значений, подставляемых в SQL

grpc:
  client:
    analyzer:
      address: 'discovery:///analyzer'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
    collector:
      address: 'discovery:///collector'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext