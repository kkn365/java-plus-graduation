grpc:
  server:
    port: 0

spring:
  config:
    activate:
      on-profile: test  # Активирует эту конфигурацию только при запущенном профиле 'test'

  jpa:
    hibernate:
      ddl-auto: update  # Включает автоматическое обновление схемы БД в тестах
    properties:
      hibernate:
        format_sql: true  # Форматирование SQL-запросов в логах для удобства отладки

  datasource:
    driver-class-name: org.h2.Driver  # Используется вместо deprecated driverClassName
    url: jdbc:h2:mem:analytics_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH  # H2 в памяти с PostgreSQL-совместимым режимом
    username: recomm-analyzer-test
    password: recomm-analyzer-test

  # Автоматическое связывание с KafkaTemplate
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: "recomm.analyzer.consumer"
      enable-auto-commit: false

# Маппинг логических имен топиков на реальные имена в Kafka
analyzer:
  kafka:
    consumer:
      topics:
        user-actions: "stats.user-actions.v1"
        events-similarity: "stats.events-similarity.v1"